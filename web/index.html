<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The server may sit under a base path (/media/watch/...). Everything up to and
      // including the first /watch segment is the app root; the built assets are
      // relative, so <base> makes them (and the favicon) resolve from there on any
      // deep link.
      (function () {
        var p = location.pathname;
        var i = p.indexOf('/watch');
        var root = (i >= 0 ? p.slice(0, i) : '') + '/watch/';
        var base = document.createElement('base');
        base.href = root;
        document.head.appendChild(base);
        var icon = document.createElement('link');
        icon.rel = 'icon';
        icon.href = root.replace(/watch\/$/, 'favicon.ico');
        document.head.appendChild(icon);
        // Both are served by the backend from the uploaded web-icon branding slot.
        var touch = document.createElement('link');
        touch.rel = 'apple-touch-icon';
        touch.href = root.replace(/watch\/$/, 'apple-touch-icon.png');
        document.head.appendChild(touch);
        // Apply the last-used accent before first paint so buttons don't flash the
        // default amber while settings load (lib/theme.ts keeps these up to date).
        try {
          var accent = localStorage.getItem('mediastorm.accent');
          if (/^#[0-9a-f]{6}$/i.test(accent || '')) {
            var st = document.documentElement.style;
            st.setProperty('--accent', accent);
            st.setProperty('--accent-contrast', localStorage.getItem('mediastorm.accentContrast') || '#111111');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>MediaStorm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
