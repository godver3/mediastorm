# Isolated admin-dev stack. Never shares network, volumes, or DB with the live
# Dockge "mediastorm" stack on :7777.
#
#   docker compose -p mediastorm-admin-dev -f docker-compose.admin-dev.yml up -d --build
#   http://localhost:7778/admin/settings

name: mediastorm-admin-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediastorm-admin-dev-postgres
    environment:
      POSTGRES_DB: mediastorm
      POSTGRES_USER: mediastorm
      POSTGRES_PASSWORD: ${ADMIN_DEV_POSTGRES_PASSWORD:-mediastorm-admin-dev}
    volumes:
      - admin_dev_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediastorm"]
      interval: 5s
      timeout: 5s
      retries: 5

  mediastorm:
    build:
      context: .
      dockerfile: Dockerfile.admin-dev
    image: mediastorm-admin-dev:local
    container_name: mediastorm-admin-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7778:7777"
    volumes:
      - ./.dev-data/cache:/root/cache
    environment:
      - TZ=${TZ:-UTC}
      - DATABASE_URL=postgres://mediastorm:${ADMIN_DEV_POSTGRES_PASSWORD:-mediastorm-admin-dev}@postgres:5432/mediastorm?sslmode=disable
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "http://localhost:7777/health"]
      interval: 30s
      timeout: 3s
      start_period: 25s
      retries: 5

volumes:
  admin_dev_postgres_data:
