<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visible title API fixture</title>
<style>body{margin:0;background:#10151d;color:#e8efff;font:17px system-ui}header{position:sticky;top:0;background:#10151df5;padding:16px 24px;z-index:1;border-bottom:1px solid #44546b}h1{font-size:24px;margin:8px 0}p{margin:8px 0}main{max-width:850px;margin:20px auto;padding:0 20px}article{height:240px;box-sizing:border-box;border:1px solid #627389;background:#1d2939;border-radius:10px;margin:20px 0;padding:20px}.state{color:#8ddbc7;font-weight:700}.state[data-state=not_found]{color:#ffbb8c}button{padding:10px;margin:6px 8px 0 0;background:#2a4055;color:white;border:1px solid #8594a8;border-radius:5px}#error{color:#ff8888}small{color:#bfd1e6}</style>
<header><small>BACKEND VIEWPORT FIXTURE · SYNTHETIC DATA</small><h1>Only visible titles request source checks</h1><p>This HTML fixture drives the real API and worker. It does not show the native TV/phone layout or media playback.</p><button id="hide">Hide cards</button><button id="show">Show cards</button><span id="metrics">Loading catalogue</span><div id="error"></div></header><main id="cards"></main>
<script>
const client='fixture-client',view='reference-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),visible=new Set();let version=0,busy=false,hidden=false,timer,observed={},queries=0;
const headers={'Content-Type':'application/json','X-Client-ID':client};
async function demand(){if(busy)return;busy=true;try{const ids=hidden||document.hidden?[]:[...visible].sort((a,b)=>+a.split('-')[1]-+b.split('-')[1]);const v=++version;const r=await fetch('/api/users/profile/source-availability/titles/'+view,{method:'PUT',headers,body:JSON.stringify({version:v,titles:ids.map(titleId=>({titleId,mediaType:'movie'}))})});if(!r.ok)throw Error('Demand failed '+r.status);const data=await r.json();for(const item of data.items){const element=document.querySelector('[data-title="'+item.titleId+'"] .state');if(element){element.dataset.state=item.sourceAvailability?.state||'unknown';element.textContent=element.dataset.state+' · '+(item.sourceAvailability?.reason||'unknown')}}document.querySelector('#metrics').textContent=ids.length?'Visible demand: '+ids.join(', '):'Demand released';observed=data;}catch(e){document.querySelector('#error').textContent=e.message}finally{busy=false}}
function schedule(){clearTimeout(timer);timer=setTimeout(demand,150)}
const observer=new IntersectionObserver(entries=>{for(const entry of entries){const id=entry.target.dataset.title;if(entry.isIntersecting&&entry.intersectionRect.width>0&&entry.intersectionRect.height>0)visible.add(id);else visible.delete(id)}schedule()},{rootMargin:'-220px 0px 0px 0px'});
fetch('/fixture/catalogue').then(r=>r.json()).then(titles=>{for(const title of titles){const article=document.createElement('article');article.dataset.title=title.id;article.innerHTML='<h2>'+title.name+'</h2><p class="state" data-state="unknown">unknown · not checked</p><p>Catalogue metadata is already available. Source evidence is requested only while this card intersects the viewport.</p>';document.querySelector('#cards').append(article);observer.observe(article)}});
document.querySelector('#hide').onclick=()=>{hidden=true;document.querySelector('#cards').style.display='none';schedule()};document.querySelector('#show').onclick=()=>{hidden=false;document.querySelector('#cards').style.display='';schedule()};document.addEventListener('visibilitychange',schedule);setInterval(demand,1000);window.addEventListener('pagehide',()=>fetch('/api/users/profile/source-availability/titles/'+view,{method:'PUT',headers,keepalive:true,body:JSON.stringify({version:++version,titles:[]})}));
</script></html>
